[package]
edition = "2024"
name = "wasm"
publish = false
version = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
rustc-hash = "2.1.1"
wasm-bindgen = "0.2"
gloo-utils = { version = "0.3", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
lto = true
